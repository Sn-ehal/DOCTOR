<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCare India - Book Top Doctors Online</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0f3bd',
              100: '#e6ebd1',
              200: '#d1dbc2',
              300: '#8ce2c8',
              400: '#02c39a',
              500: '#00a896',
              600: '#028090',
              700: '#05668d',
              800: '#045272',
              900: '#033f57',
              950: '#022b3c',
            },
            emerald: {
              50: '#f0f3bd',
              100: '#e6ebd1',
              200: '#d1dbc2',
              300: '#8ce2c8',
              400: '#02c39a',
              500: '#00a896',
              600: '#028090',
              700: '#05668d',
              800: '#045272',
              900: '#033f57',
              950: '#022b3c',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- React Mount Point -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- Data Script -->
  <script src="js/data.js"></script>
  <!-- Shared React Navbar & Footer (Plain JS, zero CORS error) -->
  <script src="js/react-components.js"></script>

  <!-- React 18 Component for Page 1: Home -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function HomePageApp() {
      const [doctors, setDoctors] = useState([]);
      const [specialties, setSpecialties] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => {
        setDoctors(DataStore.getDoctors());
        setSpecialties(DataStore.getSpecialties());
      }, []);

      const featuredDoctors = doctors.filter(d => d.featured).slice(0, 4);

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        window.location.href = `doctors.html?q=${encodeURIComponent(searchQuery)}`;
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* React Navbar */}
          <ReactNavbar activePage="home" />

          {/* Main Hero Section */}
          <main className="flex-1 space-y-16 pb-16">
            
            <section className="relative overflow-hidden bg-gradient-to-b from-teal-50/70 dark:from-teal-950/40 via-white dark:via-slate-900 to-slate-50 dark:to-slate-950 pt-12 sm:pt-20 pb-16 border-b border-slate-100 dark:border-slate-800">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                  
                  <div className="lg:col-span-7 space-y-6 text-center lg:text-left">
                    <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-teal-100/80 dark:bg-teal-950/80 text-teal-800 dark:text-teal-300 text-xs font-semibold">
                      <DynamicIcon name="sparkles" className="w-3.5 h-3.5 text-teal-600 dark:text-teal-400" />
                      <span>India's Trusted Doctor Booking Platform</span>
                    </div>

                    <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 dark:text-white tracking-tight leading-[1.15]">
                      Book Top Doctors. <br />
                      <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-emerald-500 dark:from-teal-400 dark:to-emerald-400">
                        Zero Waiting Time.
                      </span>
                    </h1>

                    <p className="text-base sm:text-lg text-slate-600 dark:text-slate-300 max-w-xl mx-auto lg:mx-0 leading-relaxed">
                      Consult verified specialists from Apollo, Fortis, Max, and AIIMS. Select real-time slots and get digital passes in Indian Rupees (₹).
                    </p>

                    {/* Search Bar */}
                    <form
                      onSubmit={handleSearchSubmit}
                      className="bg-white dark:bg-slate-900 p-2.5 rounded-2xl shadow-xl shadow-slate-200/60 dark:shadow-slate-950/60 border border-slate-200 dark:border-slate-800 max-w-xl mx-auto lg:mx-0 flex flex-col sm:flex-row gap-2"
                    >
                      <div className="flex-1 flex items-center gap-3 px-3 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl">
                        <DynamicIcon name="search" className="w-5 h-5 text-slate-400" />
                        <input
                          type="text"
                          placeholder="Search doctor, hospital, or specialty..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="w-full bg-transparent text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 outline-none font-medium"
                        />
                      </div>
                      <button
                        type="submit"
                        className="px-6 py-3 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold rounded-xl shadow-md shadow-teal-600/20 transition-all flex items-center justify-center gap-2 active:scale-95 cursor-pointer"
                      >
                        <DynamicIcon name="calendar" className="w-4 h-4" />
                        <span>Find Doctors</span>
                      </button>
                    </form>

                    {/* Trust Stats */}
                    <div className="pt-6 grid grid-cols-3 gap-4 border-t border-slate-200/80 dark:border-slate-800 max-w-lg mx-auto lg:mx-0">
                      <div>
                        <div className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">500+</div>
                        <div className="text-xs text-slate-500 dark:text-slate-400 font-medium">Verified Indian Doctors</div>
                      </div>
                      <div>
                        <div className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">4.9 ★</div>
                        <div className="text-xs text-slate-500 dark:text-slate-400 font-medium">Patient Satisfaction</div>
                      </div>
                      <div>
                        <div className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">100%</div>
                        <div className="text-xs text-slate-500 dark:text-slate-400 font-medium">Instant Confirmation</div>
                      </div>
                    </div>
                  </div>

                  {/* Graphic */}
                  <div className="lg:col-span-5 relative">
                    <div className="relative mx-auto max-w-md rounded-3xl overflow-hidden shadow-2xl border-4 border-white dark:border-slate-800 bg-slate-100 dark:bg-slate-800">
                      <img
                        src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=800"
                        alt="Doctor Consultation"
                        className="w-full h-[420px] object-cover"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"></div>

                      <div className="absolute bottom-4 left-4 right-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur p-4 rounded-2xl border border-white/40 dark:border-slate-700/40 shadow-lg">
                        <div className="flex items-center gap-3">
                          <div className="w-12 h-12 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold">
                            <DynamicIcon name="heart-pulse" className="w-6 h-6" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <h4 className="font-bold text-slate-900 dark:text-white text-sm">Instant Slot Reservation</h4>
                            <p className="text-xs text-slate-500 dark:text-slate-400">Live booking across Delhi, Mumbai & BLR</p>
                          </div>
                          <span className="px-2.5 py-1 bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 text-[10px] font-bold rounded-full">
                            LIVE
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </section>

            {/* Specialties Section */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between mb-8">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400">Categories</span>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Explore by Medical Specialty</h2>
                </div>
                <a href="doctors.html" className="text-sm font-semibold text-teal-600 dark:text-teal-400 hover:text-teal-700 dark:hover:text-teal-300 flex items-center gap-1 mt-2 sm:mt-0">
                  View all departments <DynamicIcon name="arrow-right" className="w-4 h-4 pointer-events-none" />
                </a>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
                {specialties.filter(s => s.id !== 'all').map((spec) => (
                  <a
                    key={spec.id}
                    href={`doctors.html?specialty=${spec.id}`}
                    className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md hover:border-teal-500 dark:hover:border-teal-400 cursor-pointer transition-all text-center group flex flex-col items-center justify-center gap-3"
                  >
                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-110 ${spec.color}`}>
                      <DynamicIcon name={spec.icon} className="w-7 h-7 pointer-events-none" />
                    </div>
                    <div>
                      <h4 className="font-bold text-slate-800 dark:text-slate-200 text-sm group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">
                        {spec.name}
                      </h4>
                      <span className="text-[11px] text-slate-400 dark:text-slate-500 font-medium">
                        {spec.count} Doctors
                      </span>
                    </div>
                  </a>
                ))}
              </div>
            </section>

            {/* Featured Doctors (In Indian Currency ₹) */}
            <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col sm:flex-row sm:items-end justify-between mb-8">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400">Top Rated in India</span>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Featured Specialists</h2>
                </div>
                <a href="doctors.html" className="text-sm font-semibold text-teal-600 dark:text-teal-400 hover:text-teal-700 dark:hover:text-teal-300 flex items-center gap-1 mt-2 sm:mt-0">
                  See all doctors <DynamicIcon name="arrow-right" className="w-4 h-4 pointer-events-none" />
                </a>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                {featuredDoctors.map((doc) => (
                  <div key={doc.id} className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md transition-all hover:border-teal-200 dark:hover:border-teal-700 flex flex-col overflow-hidden group">
                    <div className="p-5 flex gap-4 items-start">
                      <div className="relative flex-shrink-0">
                        <img src={doc.avatar} alt={doc.name} className="w-20 h-20 rounded-2xl object-cover border border-slate-100 dark:border-slate-800 shadow-inner group-hover:scale-105 transition-transform" />
                        <div className="absolute -bottom-2 -right-1 bg-emerald-500 text-white rounded-full p-1 shadow">
                          <DynamicIcon name="check" className="w-3 h-3 stroke-[3] pointer-events-none" />
                        </div>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-[11px] font-bold uppercase tracking-wider text-teal-700 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/60 px-2 py-0.5 rounded-full">
                            {doc.specialtyName}
                          </span>
                          <span className="flex items-center text-xs font-semibold text-amber-500 gap-0.5">
                            <DynamicIcon name="star" className="w-3.5 h-3.5 fill-amber-400 stroke-amber-400 pointer-events-none" />
                            {doc.rating}
                          </span>
                        </div>
                        <h3 className="font-bold text-slate-900 dark:text-white text-base truncate group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">{doc.name}</h3>
                        <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-1 mb-2">{doc.title}</p>
                        <div className="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-400">
                          <span>{doc.experienceYears} yrs exp</span>
                          <span>•</span>
                          <span className="truncate">{doc.hospital.split(',')[0]}</span>
                        </div>
                      </div>
                    </div>

                    <div className="mt-auto px-5 py-3.5 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                      <div>
                        <span className="text-[11px] text-slate-500 dark:text-slate-400 block">Consultation Fee</span>
                        <span className="text-lg font-bold text-slate-900 dark:text-white">₹{doc.fee}</span>
                      </div>
                      <a
                        href={`doctor-detail.html?id=${doc.id}`}
                        className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-sm hover:shadow transition-all flex items-center gap-1.5 active:scale-95"
                      >
                        <span>Book Visit</span>
                        <DynamicIcon name="chevron-right" className="w-3.5 h-3.5 pointer-events-none" />
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* How It Works */}
            <section className="bg-slate-100/70 dark:bg-slate-900/60 py-16 border-y border-slate-200/60 dark:border-slate-800/60">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="text-center max-w-2xl mx-auto mb-12">
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400">Simplicity</span>
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">How PulseCare Works</h2>
                  <p className="text-sm text-slate-600 dark:text-slate-400 mt-2">
                    Schedule your clinic or online video consultation in 3 easy steps.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <div className="w-12 h-12 rounded-xl bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 flex items-center justify-center font-black text-lg mb-4">
                      1
                    </div>
                    <h3 className="font-bold text-slate-900 dark:text-white text-lg mb-2">1. Choose a Doctor</h3>
                    <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                      Search by specialty, consultation fee (₹), city, or hospital to find certified specialists.
                    </p>
                  </div>

                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <div className="w-12 h-12 rounded-xl bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 flex items-center justify-center font-black text-lg mb-4">
                      2
                    </div>
                    <h3 className="font-bold text-slate-900 dark:text-white text-lg mb-2">2. Pick Date & Slot</h3>
                    <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                      View real-time morning, afternoon, and evening availability across 7 days with live double-booking protection.
                    </p>
                  </div>

                  <div className="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <div className="w-12 h-12 rounded-xl bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 flex items-center justify-center font-black text-lg mb-4">
                      3
                    </div>
                    <h3 className="font-bold text-slate-900 dark:text-white text-lg mb-2">3. Instant Visit Pass</h3>
                    <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                      Receive your booking reference slip with hospital details, consultation fee in ₹, and printable pass.
                    </p>
                  </div>
                </div>
              </div>
            </section>

          </main>

          {/* React Footer */}
          <ReactFooter />
        </div>
      );
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<HomePageApp />);
  </script>
</body>
</html>
