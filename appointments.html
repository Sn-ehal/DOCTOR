<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCare India - My Appointments Pass</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- React Mount Point -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- Data Script -->
  <script src="js/data.js"></script>
  <!-- Shared React Navbar & Footer (Plain JS, zero CORS error) -->
  <script src="js/react-components.js"></script>

  <!-- React 18 Component for Page 4: Appointments Dashboard -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function AppointmentsApp() {
      const [appointments, setAppointments] = useState([]);
      const [currentTab, setCurrentTab] = useState('upcoming'); // 'upcoming', 'past', 'cancelled'
      const [receiptAppointment, setReceiptAppointment] = useState(null);

      // Load appointments
      const reloadAppointments = () => {
        const list = DataStore.getAppointments().filter(a => a.patientName === 'Aarav Sharma');
        setAppointments(list);
      };

      useEffect(() => {
        reloadAppointments();

        // Check if URL has ?booked=APT-xxxx
        const urlParams = new URLSearchParams(window.location.search);
        const bookedId = urlParams.get('booked');
        if (bookedId) {
          const apt = DataStore.getAppointments().find(a => a.id === bookedId);
          if (apt) setReceiptAppointment(apt);
        }
      }, []);

      const upcoming = appointments.filter(a => a.status === 'Confirmed');
      const past = appointments.filter(a => a.status === 'Completed');
      const cancelled = appointments.filter(a => a.status === 'Cancelled');

      const displayedList = currentTab === 'upcoming' ? upcoming : currentTab === 'past' ? past : cancelled;

      const handleCancelBooking = (id, doctorName) => {
        if (confirm(`Are you sure you want to cancel your consultation with ${doctorName}? This slot will be released back to the calendar.`)) {
          DataStore.cancelAppointment(id);
          reloadAppointments();
        }
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          <ReactNavbar activePage="appointments" />

          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 w-full">
            
            {/* Header Banner */}
            <div className="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border border-teal-100 dark:border-teal-900 text-xs font-semibold mb-2">
                  <DynamicIcon name="user" className="w-3.5 h-3.5" />
                  <span>Patient Portal: Aarav Sharma</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">My Consultation Schedule</h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  Manage your doctor visits, download passes, or review medical history.
                </p>
              </div>

              <a
                href="doctors.html"
                className="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-md shadow-teal-600/20 flex items-center gap-2 active:scale-95 cursor-pointer"
              >
                <DynamicIcon name="plus" className="w-4 h-4" />
                <span>Book New Consultation</span>
              </a>
            </div>

            {/* Dashboard Tabs */}
            <div className="flex gap-2 border-b border-slate-200 dark:border-slate-800 pb-2 text-xs font-bold">
              <button
                onClick={() => setCurrentTab('upcoming')}
                className={`tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 cursor-pointer ${
                  currentTab === 'upcoming' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                <span>Upcoming Visits</span>
                <span className="px-1.5 py-0.5 rounded-full bg-white/20 text-[10px]">{upcoming.length}</span>
              </button>
              <button
                onClick={() => setCurrentTab('past')}
                className={`tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 cursor-pointer ${
                  currentTab === 'past' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                <span>Completed Visits</span>
                <span className="px-1.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[10px]">{past.length}</span>
              </button>
              <button
                onClick={() => setCurrentTab('cancelled')}
                className={`tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 cursor-pointer ${
                  currentTab === 'cancelled' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                <span>Cancelled</span>
                <span className="px-1.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[10px]">{cancelled.length}</span>
              </button>
            </div>

            {/* Appointment Cards */}
            {displayedList.length === 0 ? (
              <div className="bg-white dark:bg-slate-900 p-12 rounded-3xl border border-slate-200 dark:border-slate-800 text-center space-y-3">
                <div className="w-14 h-14 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
                  <DynamicIcon name="calendar-x" className="w-7 h-7" />
                </div>
                <h3 className="font-bold text-slate-800 dark:text-white text-base">No appointments in this category</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">
                  You do not have any consultations listed under this section.
                </p>
                <a href="doctors.html" className="inline-block px-4 py-2 bg-teal-600 text-white text-xs font-semibold rounded-xl mt-2 cursor-pointer">
                  Browse Doctors
                </a>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {displayedList.map(apt => (
                  <div key={apt.id} className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between space-y-4">
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex items-center gap-3">
                        <img src={apt.doctorAvatar} alt={apt.doctorName} className="w-14 h-14 rounded-2xl object-cover border border-slate-100 dark:border-slate-800" />
                        <div>
                          <span className="text-[10px] font-bold uppercase tracking-wider text-teal-700 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/60 px-2 py-0.5 rounded-full border border-teal-100 dark:border-teal-900">
                            {apt.doctorSpecialty}
                          </span>
                          <h4 className="font-bold text-slate-900 dark:text-white text-base mt-1">{apt.doctorName}</h4>
                          <span className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                            <DynamicIcon name={apt.consultationType === 'in-person' ? 'building-2' : 'video'} className={`w-3.5 h-3.5 ${apt.consultationType === 'video' ? 'text-blue-500' : 'text-slate-400'}`} />
                            <span>{apt.consultationType === 'in-person' ? 'Clinic Visit' : 'Video Call'}</span>
                          </span>
                        </div>
                      </div>

                      <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${
                        apt.status === 'Confirmed' ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800' :
                        apt.status === 'Completed' ? 'bg-blue-100 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300 border border-blue-200 dark:border-blue-800' : 'bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 border border-rose-200 dark:border-rose-800'
                      }`}>
                        {apt.status}
                      </span>
                    </div>

                    <div className="bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-2xl flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2">
                        <DynamicIcon name="calendar" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                        <span className="font-bold text-slate-800 dark:text-slate-200">{apt.date}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <DynamicIcon name="clock" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                        <span className="font-bold text-slate-800 dark:text-slate-200">{apt.slot}</span>
                      </div>
                      <div className="font-bold text-slate-900 dark:text-white">
                        ₹{apt.fee}
                      </div>
                    </div>

                    {apt.symptoms && (
                      <div className="text-xs text-slate-600 dark:text-slate-300 bg-slate-50/50 dark:bg-slate-800/40 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
                        <span className="font-semibold text-slate-800 dark:text-slate-200 block mb-0.5">Notes:</span>
                        {apt.symptoms}
                      </div>
                    )}

                    <div className="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2">
                      <button
                        onClick={() => setReceiptAppointment(apt)}
                        className="px-3.5 py-2 text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-colors flex items-center gap-1.5 cursor-pointer"
                      >
                        <DynamicIcon name="ticket" className="w-3.5 h-3.5" />
                        <span>View Pass</span>
                      </button>

                      {apt.status === 'Confirmed' && (
                        <button
                          onClick={() => handleCancelBooking(apt.id, apt.doctorName)}
                          className="px-3.5 py-2 text-xs font-bold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 rounded-xl transition-colors flex items-center gap-1 cursor-pointer"
                        >
                          <DynamicIcon name="x-circle" className="w-3.5 h-3.5" />
                          <span>Cancel Booking</span>
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Official Appointment Pass Modal in React */}
            {receiptAppointment && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 dark:bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
                <div id="printable-pass" className="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden relative animate-in fade-in zoom-in-95">
                  
                  <div className="bg-gradient-to-r from-teal-600 to-teal-700 text-white p-6 text-center relative">
                    <button
                      onClick={() => setReceiptAppointment(null)}
                      className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white cursor-pointer"
                    >
                      <DynamicIcon name="x" className="w-4 h-4" />
                    </button>
                    <div className="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center mx-auto mb-2">
                      <DynamicIcon name="heart-pulse" className="w-6 h-6 text-white" />
                    </div>
                    <h3 className="font-extrabold text-lg">Official Appointment Pass</h3>
                    <p className="text-teal-100 text-xs">PulseCare Hospital Admission Slip</p>
                  </div>

                  <div className="p-6 space-y-4 text-xs">
                    <div className="flex items-center justify-between border-b border-dashed border-slate-200 dark:border-slate-800 pb-3">
                      <span className="text-slate-500 dark:text-slate-400">Booking Reference</span>
                      <span className="font-mono font-black text-slate-900 dark:text-white text-sm tracking-wider">#{receiptAppointment.id}</span>
                    </div>

                    <div className="flex items-center gap-3">
                      <img src={receiptAppointment.doctorAvatar} alt={receiptAppointment.doctorName} className="w-12 h-12 rounded-xl object-cover border border-slate-200 dark:border-slate-700" />
                      <div>
                        <h4 className="font-bold text-slate-900 dark:text-white text-sm">{receiptAppointment.doctorName}</h4>
                        <p className="text-slate-500 dark:text-slate-400">{receiptAppointment.doctorSpecialty}</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3 bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl">
                      <div>
                        <span className="text-slate-400 dark:text-slate-500 block text-[10px]">Date</span>
                        <span className="font-bold text-slate-900 dark:text-white">{receiptAppointment.date}</span>
                      </div>
                      <div>
                        <span className="text-slate-400 dark:text-slate-500 block text-[10px]">Time Slot</span>
                        <span className="font-bold text-teal-700 dark:text-teal-400">{receiptAppointment.slot}</span>
                      </div>
                    </div>

                    <div className="space-y-1.5 text-slate-600 dark:text-slate-300">
                      <div className="flex justify-between">
                        <span>Patient Name:</span>
                        <span className="font-bold text-slate-800 dark:text-slate-100">{receiptAppointment.patientName}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Consultation Mode:</span>
                        <span className="font-bold text-slate-800 dark:text-slate-100">
                          {receiptAppointment.consultationType === 'in-person' ? 'In-Person Hospital Visit' : 'Online Video Consultation'}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Consultation Fee:</span>
                        <span className="font-bold text-slate-800 dark:text-slate-100">₹{receiptAppointment.fee} (Pay upon visit)</span>
                      </div>
                    </div>

                    {/* Barcode */}
                    <div className="pt-3 text-center border-t border-dashed border-slate-200 dark:border-slate-800">
                      <div className="h-10 bg-slate-800 dark:bg-slate-950 rounded flex items-center justify-around px-4 text-white text-[9px] font-mono tracking-widest">
                        ||| | |||| || | ||||| || ||| | |||
                      </div>
                      <span className="text-[10px] text-slate-400 dark:text-slate-500 mt-1 block">Present this slip at hospital reception desk</span>
                    </div>

                    <div className="pt-2 flex gap-2">
                      <button
                        onClick={() => window.print()}
                        className="flex-1 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl flex items-center justify-center gap-1.5 cursor-pointer"
                      >
                        <DynamicIcon name="printer" className="w-4 h-4" />
                        <span>Print Pass</span>
                      </button>
                      <button
                        onClick={() => setReceiptAppointment(null)}
                        className="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-xl cursor-pointer"
                      >
                        Close
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          <ReactFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppointmentsApp />);
  </script>
</body>
</html>
