<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCare India - Doctor Profile & Book Slot</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- React Mount Point -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- Data Script -->
  <script src="js/data.js"></script>
  <!-- Shared React Navbar & Footer (Plain JS, zero CORS error) -->
  <script src="js/react-components.js"></script>

  <!-- React 18 Component for Page 3: Doctor Detail & Slot Engine -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    function DoctorDetailApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const doctorId = urlParams.get('id') || 'doc-1';
      const doctor = DataStore.getDoctorById(doctorId);

      const upcomingDays = useMemo(() => getUpcomingDays(7), []);
      const [selectedDateKey, setSelectedDateKey] = useState(upcomingDays[0].dateKey);
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [consultationType, setConsultationType] = useState('in-person');

      // Modal Form State
      const [showModal, setShowModal] = useState(false);
      const [patientName, setPatientName] = useState('Aarav Sharma');
      const [patientPhone, setPatientPhone] = useState('+91 98765 43210');
      const [patientEmail, setPatientEmail] = useState('aarav.sharma@example.in');
      const [patientAge, setPatientAge] = useState('32');
      const [symptoms, setSymptoms] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const selectedDayObj = upcomingDays.find(d => d.dateKey === selectedDateKey);

      const handleConfirmBooking = (e) => {
        e.preventDefault();
        if (!selectedSlot) return;

        setIsSubmitting(true);
        setTimeout(() => {
          const newApt = DataStore.bookAppointment({
            doctorId: doctor.id,
            doctorName: doctor.name,
            doctorSpecialty: doctor.specialtyName,
            doctorAvatar: doctor.avatar,
            patientName,
            patientEmail,
            patientPhone,
            patientAge: Number(patientAge),
            date: selectedDateKey,
            slot: selectedSlot,
            consultationType,
            symptoms: symptoms || 'General Medical Consultation',
            fee: doctor.fee
          });

          // Redirect to Page 4 with the newly generated booking ID!
          window.location.href = `appointments.html?booked=${newApt.id}`;
        }, 500);
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          <ReactNavbar activePage="doctors" />

          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 w-full">
            
            {/* Back Button */}
            <a
              href="doctors.html"
              className="inline-flex items-center gap-1.5 text-xs font-bold text-slate-600 dark:text-slate-400 hover:text-teal-600 dark:hover:text-teal-400 transition-colors"
            >
              <DynamicIcon name="arrow-left" className="w-4 h-4" />
              Back to Doctors Directory
            </a>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Left Column: Doctor Profile & Qualifications */}
              <section className="lg:col-span-5 space-y-6">
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                  
                  <div className="flex items-center gap-4">
                    <img
                      src={doctor.avatar}
                      alt={doctor.name}
                      className="w-24 h-24 rounded-3xl object-cover border-2 border-teal-50 dark:border-teal-900 shadow-md"
                    />
                    <div>
                      <span className="text-[11px] font-bold uppercase tracking-wider text-teal-700 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/60 px-2.5 py-0.5 rounded-full border border-teal-100 dark:border-teal-900">
                        {doctor.specialtyName}
                      </span>
                      <h1 className="text-xl font-black text-slate-900 dark:text-white mt-1">{doctor.name}</h1>
                      <p className="text-xs text-slate-500 dark:text-slate-400">{doctor.title}</p>
                      <div className="flex items-center gap-2 mt-2 text-xs font-semibold text-amber-500">
                        <DynamicIcon name="star" className="w-3.5 h-3.5 fill-amber-400 stroke-amber-400" />
                        <span>{doctor.rating}</span>
                        <span className="text-slate-400 dark:text-slate-500 font-normal">({doctor.reviewsCount} patient reviews)</span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-3 text-center">
                    <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl">
                      <span className="text-[11px] text-slate-400 dark:text-slate-500 block font-medium">Experience</span>
                      <span className="font-extrabold text-slate-900 dark:text-white text-sm">{doctor.experienceYears} Years</span>
                    </div>
                    <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl">
                      <span className="text-[11px] text-slate-400 dark:text-slate-500 block font-medium">Consultation Fee</span>
                      <span className="font-extrabold text-teal-600 dark:text-teal-400 text-sm">₹{doctor.fee}</span>
                    </div>
                  </div>

                  <div className="space-y-3 pt-2">
                    <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">About the Doctor</h4>
                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                      {doctor.about}
                    </p>
                  </div>

                  <div className="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                    <div className="flex items-start gap-2.5 text-slate-600 dark:text-slate-300">
                      <DynamicIcon name="graduation-cap" className="w-4 h-4 text-teal-600 dark:text-teal-400 flex-shrink-0 mt-0.5" />
                      <span><strong>Education:</strong> {doctor.education}</span>
                    </div>
                    <div className="flex items-start gap-2.5 text-slate-600 dark:text-slate-300">
                      <DynamicIcon name="hospital" className="w-4 h-4 text-teal-600 dark:text-teal-400 flex-shrink-0 mt-0.5" />
                      <span><strong>Hospital:</strong> {doctor.hospital}</span>
                    </div>
                    <div className="flex items-center gap-2.5 text-slate-600 dark:text-slate-300">
                      <DynamicIcon name="languages" className="w-4 h-4 text-teal-600 dark:text-teal-400 flex-shrink-0" />
                      <span><strong>Languages:</strong> {doctor.languages.join(', ')}</span>
                    </div>
                  </div>

                </div>
              </section>

              {/* Right Column: Interactive Date Strip & Slot Engine */}
              <section className="lg:col-span-7 space-y-6">
                <div className="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                  
                  <div>
                    <h2 className="text-xl font-black text-slate-900 dark:text-white">Select Date & Time Slot</h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Choose your consultation type and click an available appointment slot.
                    </p>
                  </div>

                  {/* Consultation Mode Selector */}
                  <div className="grid grid-cols-2 gap-3 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl">
                    <button
                      type="button"
                      onClick={() => setConsultationType('in-person')}
                      className={`py-3 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all cursor-pointer ${
                        consultationType === 'in-person'
                          ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                      }`}
                    >
                      <DynamicIcon name="building-2" className="w-4 h-4" />
                      <span>In-Person Clinic Visit</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => setConsultationType('video')}
                      className={`py-3 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all cursor-pointer ${
                        consultationType === 'video'
                          ? 'bg-white dark:bg-slate-700 text-teal-700 dark:text-teal-300 shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                      }`}
                    >
                      <DynamicIcon name="video" className="w-4 h-4" />
                      <span>Online Video Consult</span>
                    </button>
                  </div>

                  {/* 7-Day Horizontal Date Strip */}
                  <div>
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 block">
                      Choose Appointment Date
                    </label>
                    <div className="flex gap-2.5 overflow-x-auto pb-2 custom-scrollbar">
                      {upcomingDays.map((day) => {
                        const isSelected = day.dateKey === selectedDateKey;
                        return (
                          <button
                            key={day.dateKey}
                            onClick={() => {
                              setSelectedDateKey(day.dateKey);
                              setSelectedSlot(null);
                            }}
                            className={`flex-shrink-0 w-20 py-3 px-2 rounded-2xl border flex flex-col items-center gap-1 transition-all cursor-pointer ${
                              isSelected
                                ? 'bg-teal-600 text-white border-teal-600 shadow-md shadow-teal-600/25 scale-105'
                                : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-teal-400 dark:hover:border-teal-500 hover:bg-slate-50 dark:hover:bg-slate-750'
                            }`}
                          >
                            <span className={`text-[11px] font-semibold uppercase ${isSelected ? 'text-teal-100' : 'text-slate-400 dark:text-slate-500'}`}>
                              {day.dayName}
                            </span>
                            <span className="text-lg font-black leading-none">{day.dayNumber}</span>
                            <span className={`text-[10px] font-medium ${isSelected ? 'text-teal-100' : 'text-slate-400 dark:text-slate-500'}`}>
                              {day.monthName}
                            </span>
                            {day.isToday && (
                              <span className={`text-[9px] font-bold px-1.5 py-0.2 rounded-full mt-0.5 ${
                                isSelected ? 'bg-white/20 text-white' : 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300'
                              }`}>
                                Today
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Slot Groups (Morning / Afternoon / Evening) */}
                  <div className="space-y-5 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        Available Slots for {selectedDayObj?.dayName}, {selectedDayObj?.monthName} {selectedDayObj?.dayNumber}
                      </span>
                      <div className="flex items-center gap-3 text-[11px] text-slate-500 dark:text-slate-400">
                        <span className="flex items-center gap-1">
                          <span className="w-2.5 h-2.5 rounded-full bg-teal-500"></span> Available
                        </span>
                        <span className="flex items-center gap-1">
                          <span className="w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600"></span> Booked
                        </span>
                      </div>
                    </div>

                    {/* Morning */}
                    <div>
                      <h4 className="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2 flex items-center gap-1.5">
                        <DynamicIcon name="sun" className="w-3.5 h-3.5 text-amber-500" />
                        Morning (09:00 AM - 12:00 PM)
                      </h4>
                      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                        {DEFAULT_SLOTS.morning.map(time => {
                          const booked = DataStore.isSlotBooked(doctor.id, selectedDateKey, time);
                          const isSelected = selectedSlot === time;
                          return (
                            <button
                              key={time}
                              disabled={booked}
                              onClick={() => setSelectedSlot(time)}
                              className={`py-2 px-1 text-xs font-semibold rounded-xl border transition-all text-center cursor-pointer ${
                                booked
                                  ? 'bg-slate-100 dark:bg-slate-800/50 text-slate-400 dark:text-slate-600 border-slate-200 dark:border-slate-800 cursor-not-allowed line-through'
                                  : isSelected
                                  ? 'bg-teal-600 text-white border-teal-600 shadow-sm ring-2 ring-teal-300 dark:ring-teal-700'
                                  : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-teal-500 hover:text-teal-600 dark:hover:text-teal-400'
                              }`}
                            >
                              {time}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Afternoon */}
                    <div>
                      <h4 className="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2 flex items-center gap-1.5">
                        <DynamicIcon name="cloud-sun" className="w-3.5 h-3.5 text-blue-500" />
                        Afternoon (01:00 PM - 04:00 PM)
                      </h4>
                      <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                        {DEFAULT_SLOTS.afternoon.map(time => {
                          const booked = DataStore.isSlotBooked(doctor.id, selectedDateKey, time);
                          const isSelected = selectedSlot === time;
                          return (
                            <button
                              key={time}
                              disabled={booked}
                              onClick={() => setSelectedSlot(time)}
                              className={`py-2 px-1 text-xs font-semibold rounded-xl border transition-all text-center cursor-pointer ${
                                booked
                                  ? 'bg-slate-100 dark:bg-slate-800/50 text-slate-400 dark:text-slate-600 border-slate-200 dark:border-slate-800 cursor-not-allowed line-through'
                                  : isSelected
                                  ? 'bg-teal-600 text-white border-teal-600 shadow-sm ring-2 ring-teal-300 dark:ring-teal-700'
                                  : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-teal-500 hover:text-teal-600 dark:hover:text-teal-400'
                              }`}
                            >
                              {time}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Evening */}
                    <div>
                      <h4 className="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2 flex items-center gap-1.5">
                        <DynamicIcon name="moon" className="w-3.5 h-3.5 text-purple-500" />
                        Evening (04:30 PM - 06:30 PM)
                      </h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        {DEFAULT_SLOTS.evening.map(time => {
                          const booked = DataStore.isSlotBooked(doctor.id, selectedDateKey, time);
                          const isSelected = selectedSlot === time;
                          return (
                            <button
                              key={time}
                              disabled={booked}
                              onClick={() => setSelectedSlot(time)}
                              className={`py-2 px-1 text-xs font-semibold rounded-xl border transition-all text-center cursor-pointer ${
                                booked
                                  ? 'bg-slate-100 dark:bg-slate-800/50 text-slate-400 dark:text-slate-600 border-slate-200 dark:border-slate-800 cursor-not-allowed line-through'
                                  : isSelected
                                  ? 'bg-teal-600 text-white border-teal-600 shadow-sm ring-2 ring-teal-300 dark:ring-teal-700'
                                  : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-teal-500 hover:text-teal-600 dark:hover:text-teal-400'
                              }`}
                            >
                              {time}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>

                  {/* Proceed Action Bar */}
                  <div className="pt-6 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                      <span className="text-xs text-slate-400 dark:text-slate-500 font-medium block">Selected Slot</span>
                      <div className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                        <DynamicIcon name="calendar-check" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                        {selectedSlot ? (
                          <span>{selectedDayObj?.dayName}, {selectedDayObj?.monthName} {selectedDayObj?.dayNumber} at <span className="text-teal-600 dark:text-teal-400">{selectedSlot}</span></span>
                        ) : (
                          <span className="text-slate-400 dark:text-slate-500 font-normal italic">Please pick an available slot above</span>
                        )}
                      </div>
                    </div>

                    <button
                      disabled={!selectedSlot}
                      onClick={() => setShowModal(true)}
                      className={`w-full sm:w-auto px-8 py-3.5 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 shadow-lg transition-all ${
                        selectedSlot
                          ? 'bg-teal-600 hover:bg-teal-700 text-white shadow-teal-600/30 cursor-pointer active:scale-95'
                          : 'bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-600 cursor-not-allowed shadow-none'
                      }`}
                    >
                      <span>Proceed to Book (₹{doctor.fee})</span>
                      <DynamicIcon name="arrow-right" className="w-4 h-4" />
                    </button>
                  </div>

                </div>
              </section>

            </div>

            {/* Booking Form Modal in React */}
            {showModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 dark:bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden my-8 animate-in fade-in zoom-in-95 duration-200">
                  
                  {/* Modal Header */}
                  <div className="px-6 py-5 bg-gradient-to-r from-teal-600 to-teal-700 text-white flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <DynamicIcon name="file-text" className="w-5 h-5" />
                      <h3 className="font-bold text-base">Confirm Consultation Details</h3>
                    </div>
                    <button
                      onClick={() => setShowModal(false)}
                      className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors cursor-pointer"
                    >
                      <DynamicIcon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  {/* Summary Banner */}
                  <div className="bg-teal-50/70 dark:bg-teal-950/50 p-4 border-b border-teal-100 dark:border-teal-900 flex items-center gap-3">
                    <img src={doctor.avatar} alt={doctor.name} className="w-12 h-12 rounded-xl object-cover border border-white dark:border-slate-700 shadow" />
                    <div className="flex-1 text-xs">
                      <h4 className="font-bold text-slate-900 dark:text-white">{doctor.name}</h4>
                      <p className="text-slate-500 dark:text-slate-400">{doctor.specialtyName} • {consultationType === 'in-person' ? 'Clinic Visit' : 'Video Consultation'}</p>
                      <p className="text-teal-700 dark:text-teal-300 font-semibold mt-0.5">
                        📅 {selectedDayObj?.dayName}, {selectedDateKey} at {selectedSlot}
                      </p>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] text-slate-500 dark:text-slate-400 block">Total Due</span>
                      <span className="text-base font-black text-slate-900 dark:text-white">₹{doctor.fee}</span>
                    </div>
                  </div>

                  {/* Form */}
                  <form onSubmit={handleConfirmBooking} className="p-6 space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Patient Full Name</label>
                      <input
                        type="text"
                        required
                        value={patientName}
                        onChange={(e) => setPatientName(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-teal-500 outline-none text-slate-800 dark:text-slate-100"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Mobile Number (India)</label>
                        <input
                          type="tel"
                          required
                          value={patientPhone}
                          onChange={(e) => setPatientPhone(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-teal-500 outline-none text-slate-800 dark:text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Patient Age</label>
                        <input
                          type="number"
                          min="1"
                          max="120"
                          required
                          value={patientAge}
                          onChange={(e) => setPatientAge(e.target.value)}
                          className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-teal-500 outline-none text-slate-800 dark:text-slate-100"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Email Address</label>
                      <input
                        type="email"
                        required
                        value={patientEmail}
                        onChange={(e) => setPatientEmail(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-teal-500 outline-none text-slate-800 dark:text-slate-100"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300 block mb-1">Symptoms or Reason for Consultation</label>
                      <textarea
                        rows="2"
                        placeholder="E.g., chest pain, headache, child vaccination, skin allergy..."
                        value={symptoms}
                        onChange={(e) => setSymptoms(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-teal-500 outline-none text-slate-800 dark:text-slate-100"
                      ></textarea>
                    </div>

                    <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between text-slate-600 dark:text-slate-300">
                      <span className="flex items-center gap-1.5">
                        <DynamicIcon name="shield-check" className="w-4 h-4 text-emerald-600 dark:text-emerald-400" />
                        <span>Payment: Pay upon visit (No advance payment required)</span>
                      </span>
                      <span className="font-bold text-slate-900 dark:text-white">₹{doctor.fee}</span>
                    </div>

                    <div className="pt-2 flex items-center justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setShowModal(false)}
                        className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-md shadow-teal-600/20 flex items-center gap-2 cursor-pointer"
                      >
                        {isSubmitting ? (
                          <span>Reserving Slot...</span>
                        ) : (
                          <span className="inline-flex items-center gap-2">
                            <DynamicIcon name="check-circle" className="w-4 h-4" />
                            <span>Confirm & Reserve Slot</span>
                          </span>
                        )}
                      </button>
                    </div>
                  </form>

                </div>
              </div>
            )}

          </main>

          <ReactFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DoctorDetailApp />);
  </script>
</body>
</html>
