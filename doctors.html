<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCare India - Find Doctors & Specialists</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0f3bd',
              100: '#e6ebd1',
              200: '#d1dbc2',
              300: '#8ce2c8',
              400: '#02c39a',
              500: '#00a896',
              600: '#028090',
              700: '#05668d',
              800: '#045272',
              900: '#033f57',
              950: '#022b3c',
            },
            emerald: {
              50: '#f0f3bd',
              100: '#e6ebd1',
              200: '#d1dbc2',
              300: '#8ce2c8',
              400: '#02c39a',
              500: '#00a896',
              600: '#028090',
              700: '#05668d',
              800: '#045272',
              900: '#033f57',
              950: '#022b3c',
            }
          }
        }
      }
    };
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- React Mount Point -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- Data Script -->
  <script src="js/data.js"></script>
  <!-- Shared React Navbar & Footer (Plain JS, zero CORS error) -->
  <script src="js/react-components.js"></script>

  <!-- React 18 Component for Page 2: Doctors Directory -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function DoctorsApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const [specialty, setSpecialty] = useState(urlParams.get('specialty') || 'all');
      const [searchQuery, setSearchQuery] = useState(urlParams.get('q') || '');
      const [minRating, setMinRating] = useState(0);
      const [maxFee, setMaxFee] = useState(2000); // In Indian Rupees ₹
      const [sortBy, setSortBy] = useState('rating');
      const [doctors, setDoctors] = useState([]);
      const [specialtiesList, setSpecialtiesList] = useState([]);

      useEffect(() => {
        setDoctors(DataStore.getDoctors());
        setSpecialtiesList(DataStore.getSpecialties());
      }, []);

      // Filtered Doctors Calculation
      const filteredDoctors = useMemo(() => {
        return doctors
          .filter(doc => {
            if (specialty !== 'all' && doc.specialty !== specialty) return false;
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              const match = doc.name.toLowerCase().includes(q) ||
                            doc.specialtyName.toLowerCase().includes(q) ||
                            doc.hospital.toLowerCase().includes(q) ||
                            doc.about.toLowerCase().includes(q);
              if (!match) return false;
            }
            if (doc.rating < minRating) return false;
            if (doc.fee > maxFee) return false;
            return true;
          })
          .sort((a, b) => {
            if (sortBy === 'rating') return b.rating - a.rating;
            if (sortBy === 'fee-asc') return a.fee - b.fee;
            if (sortBy === 'experience') return b.experienceYears - a.experienceYears;
            return 0;
          });
      }, [doctors, specialty, searchQuery, minRating, maxFee, sortBy]);

      const handleResetFilters = () => {
        setSpecialty('all');
        setSearchQuery('');
        setMinRating(0);
        setMaxFee(2000);
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          <ReactNavbar activePage="doctors" />

          <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 w-full">
            
            {/* Search Header */}
            <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Find Qualified Doctors in India</h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  Showing {filteredDoctors.length} available specialist{filteredDoctors.length === 1 ? '' : 's'} (Fees in ₹)
                </p>
              </div>

              <div className="w-full md:w-auto flex-1 max-w-md flex items-center gap-2 bg-slate-50 dark:bg-slate-800 px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700">
                <DynamicIcon name="search" className="w-4 h-4 text-slate-400" />
                <input
                  type="text"
                  placeholder="Search doctor, hospital, or city..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-transparent text-sm w-full outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 font-medium"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <DynamicIcon name="x" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

            {/* Layout Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Left Filter Sidebar */}
              <aside className="lg:col-span-3 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6 sticky top-24">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2">
                    <DynamicIcon name="sliders-horizontal" className="w-4 h-4 text-teal-600 dark:text-teal-400" />
                    Filter Search
                  </h3>
                  <button onClick={handleResetFilters} className="text-[11px] font-semibold text-teal-600 dark:text-teal-400 hover:underline cursor-pointer">
                    Reset All
                  </button>
                </div>

                {/* Specialties */}
                <div>
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 block">
                    Medical Department
                  </label>
                  <div className="space-y-1.5">
                    {specialtiesList.map(s => {
                      const isSelected = s.id === specialty;
                      const count = s.id === 'all' ? doctors.length : doctors.filter(d => d.specialty === s.id).length;
                      return (
                        <button
                          key={s.id}
                          onClick={() => setSpecialty(s.id)}
                          className={`w-full text-left px-3 py-2 rounded-xl text-xs font-medium flex items-center justify-between transition-colors cursor-pointer ${
                            isSelected
                              ? 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 font-bold border border-teal-200 dark:border-teal-800'
                              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60'
                          }`}
                        >
                          <span>{s.name}</span>
                          <span className="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-1.5 py-0.5 rounded-full">{count}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Rating Filter */}
                <div className="pt-4 border-t border-slate-100 dark:border-slate-800">
                  <label className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 block">
                    Doctor Rating
                  </label>
                  <div className="space-y-1.5 text-xs">
                    {[
                      { label: 'Any Rating', val: 0 },
                      { label: '4.8 ★ and above', val: 4.8 },
                      { label: '4.5 ★ and above', val: 4.5 }
                    ].map(r => (
                      <button
                        key={r.val}
                        onClick={() => setMinRating(r.val)}
                        className={`w-full text-left px-3 py-2 rounded-xl font-medium transition-colors cursor-pointer ${
                          minRating === r.val
                            ? 'bg-amber-50 dark:bg-amber-950/50 text-amber-900 dark:text-amber-300 font-bold border border-amber-200 dark:border-amber-800'
                            : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60'
                        }`}
                      >
                        {r.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Consultation Fee Range in Indian Rupees ₹ */}
                <div className="pt-4 border-t border-slate-100 dark:border-slate-800">
                  <div className="flex items-center justify-between mb-2">
                    <label className="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                      Max Fee (INR)
                    </label>
                    <span className="text-xs font-bold text-slate-900 dark:text-white">₹{maxFee}</span>
                  </div>
                  <input
                    type="range"
                    min="500"
                    max="2000"
                    step="100"
                    value={maxFee}
                    onChange={(e) => setMaxFee(Number(e.target.value))}
                    className="w-full accent-teal-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-slate-400 mt-1">
                    <span>₹500</span>
                    <span>₹2,000</span>
                  </div>
                </div>
              </aside>

              {/* Right Doctors Grid */}
              <section className="lg:col-span-9 space-y-4">
                
                {/* Sort dropdown */}
                <div className="flex items-center justify-between bg-white dark:bg-slate-900 px-5 py-3 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs">
                  <span className="text-slate-500 dark:text-slate-400 font-medium">Sort doctors by:</span>
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="font-bold text-slate-800 dark:text-slate-200 bg-transparent outline-none cursor-pointer"
                  >
                    <option value="rating" className="dark:bg-slate-900">Highest Rating</option>
                    <option value="fee-asc" className="dark:bg-slate-900">Lowest Consultation Fee (₹)</option>
                    <option value="experience" className="dark:bg-slate-900">Most Years of Experience</option>
                  </select>
                </div>

                {filteredDoctors.length === 0 ? (
                  <div className="bg-white dark:bg-slate-900 p-12 rounded-3xl border border-slate-200 dark:border-slate-800 text-center space-y-4">
                    <div className="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
                      <DynamicIcon name="user-x" className="w-8 h-8" />
                    </div>
                    <h3 className="font-bold text-slate-800 dark:text-white text-lg">No doctors found</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">
                      Try broadening your search keyword, increasing the maximum fee slider, or clearing filters.
                    </p>
                    <button
                      onClick={handleResetFilters}
                      className="px-4 py-2 bg-teal-600 text-white rounded-xl text-xs font-semibold cursor-pointer"
                    >
                      Clear All Filters
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    {filteredDoctors.map(doc => (
                      <div key={doc.id} className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md transition-all hover:border-teal-200 dark:hover:border-teal-800 flex flex-col overflow-hidden group">
                        <div className="p-5 flex gap-4 items-start">
                          <div className="relative flex-shrink-0">
                            <div className="w-20 h-20 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-inner flex items-center justify-center bg-slate-50 dark:bg-slate-800 text-slate-400 group-hover:scale-105 transition-transform">
                              <DynamicIcon name={doc.avatar} className="w-10 h-10" />
                            </div>
                            <div className="absolute -bottom-2 -right-1 bg-emerald-500 text-white rounded-full p-1 shadow">
                              <DynamicIcon name="check" className="w-3 h-3 stroke-[3]" />
                            </div>
                          </div>

                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-[11px] font-bold uppercase tracking-wider text-teal-700 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/60 px-2.5 py-0.5 rounded-full border border-teal-100 dark:border-teal-900">
                                {doc.specialtyName}
                              </span>
                              <span className="flex items-center text-xs font-semibold text-amber-500 gap-0.5">
                                <DynamicIcon name="star" className="w-3.5 h-3.5 fill-amber-400 stroke-amber-400" />
                                {doc.rating}
                                <span className="text-slate-400 dark:text-slate-500 font-normal">({doc.reviewsCount})</span>
                              </span>
                            </div>

                            <h3 className="font-bold text-slate-900 dark:text-white text-base truncate group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">{doc.name}</h3>
                            <p className="text-xs text-slate-500 dark:text-slate-400 line-clamp-1 mb-2">{doc.title}</p>
                            <div className="flex items-center gap-2 text-xs text-slate-600 dark:text-slate-300">
                              <span>{doc.experienceYears} yrs exp</span>
                              <span>•</span>
                              <span className="truncate">{doc.hospital.split(',')[0]}</span>
                            </div>
                          </div>
                        </div>

                        <div className="px-5 pb-4 text-xs text-slate-600 dark:text-slate-300 line-clamp-2">
                          {doc.about}
                        </div>

                        <div className="mt-auto px-5 py-3.5 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                          <div>
                            <span className="text-[11px] text-slate-500 dark:text-slate-400 block">Consultation Fee</span>
                            <span className="text-lg font-bold text-slate-900 dark:text-white">₹{doc.fee}</span>
                            <span className="text-[11px] text-slate-400 dark:text-slate-500 font-normal"> / session</span>
                          </div>
                          <a
                            href={`doctor-detail.html?id=${doc.id}`}
                            className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-sm hover:shadow transition-all flex items-center gap-1.5 active:scale-95"
                          >
                            <span>Book Appointment</span>
                            <DynamicIcon name="chevron-right" className="w-3.5 h-3.5" />
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </section>

            </div>
          </main>

          <ReactFooter />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DoctorsApp />);
  </script>
</body>
</html>
