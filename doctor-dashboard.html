<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseCare India - Doctor Practice Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0f3bd',
              100: '#e6ebd1',
              200: '#d1dbc2',
              300: '#8ce2c8',
              400: '#02c39a',
              500: '#00a896',
              600: '#028090',
              700: '#05668d',
              800: '#045272',
              900: '#033f57',
              950: '#022b3c',
            },
            emerald: {
              50: '#f0f3bd',
              100: '#e6ebd1',
              200: '#d1dbc2',
              300: '#8ce2c8',
              400: '#02c39a',
              500: '#00a896',
              600: '#028090',
              700: '#05668d',
              800: '#045272',
              900: '#033f57',
              950: '#022b3c',
            }
          }
        }
      }
    };
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- React Mount Point -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- Data Script -->
  <script src="js/data.js"></script>
  <!-- Shared React Components (Plain JS, zero CORS error) -->
  <script src="js/react-components.js"></script>

  <!-- React 18 Component for Page 5: Doctor Portal & Queue (Pure Native JS - Zero Babel Dependency) -->
  <script>
    (function() {
      var e = React.createElement;
      var useState = React.useState;
      var useEffect = React.useEffect;

      function DoctorDashboardApp() {
        var ds = window.DataStore;
        
        // Safe doctors retrieval
        var allDoctors = [];
        try {
          allDoctors = (ds && ds.getDoctors) ? ds.getDoctors() : [];
        } catch(err) {
          allDoctors = [];
        }
        if (!Array.isArray(allDoctors) || allDoctors.length === 0) {
          allDoctors = window.INITIAL_DOCTORS || [];
        }

        // Determine starting doctor ID safely
        var urlParams = new URLSearchParams(window.location.search);
        var queryId = urlParams.get('id');
        var role = (ds && ds.getCurrentRole) ? String(ds.getCurrentRole()) : 'doc-1';
        var defaultId = (role && role.indexOf('doc-') === 0) ? role : (allDoctors[0] ? allDoctors[0].id : 'doc-1');
        var initialDocId = queryId || defaultId;

        var _docState = useState(initialDocId);
        var currentDoctorId = _docState[0];
        var setCurrentDoctorId = _docState[1];

        var _aptState = useState([]);
        var appointments = _aptState[0];
        var setAppointments = _aptState[1];

        // Active doctor object with 100% safe defaults
        var activeDoctor = null;
        try {
          if (ds && ds.getDoctorById) {
            activeDoctor = ds.getDoctorById(currentDoctorId);
          }
        } catch(err) {}
        
        if (!activeDoctor || !activeDoctor.id) {
          activeDoctor = allDoctors.find(function(d) { return d && d.id === currentDoctorId; }) || allDoctors[0] || {
            id: 'doc-1',
            name: 'Dr. Rajesh Sharma',
            title: 'MBBS, MD, DM (Cardiology) - Senior Consultant',
            specialtyName: 'Cardiology',
            hospital: 'Apollo Hospitals, New Delhi',
            avatar: 'user',
            rating: 4.9,
            reviewsCount: 182,
            fee: 1200
          };
        }

        // Sync role safely in useEffect
        useEffect(function() {
          try {
            if (ds && ds.setCurrentRole) {
              ds.setCurrentRole(currentDoctorId);
            }
          } catch(err) {}
        }, [currentDoctorId]);

        // Load doctor appointments
        var loadDoctorAppointments = function(docId) {
          try {
            var all = (ds && ds.getAppointments) ? ds.getAppointments() : [];
            if (Array.isArray(all)) {
              setAppointments(all.filter(function(a) { return a && a.doctorId === docId; }));
            } else {
              setAppointments([]);
            }
          } catch(err) {
            setAppointments([]);
          }
        };

        useEffect(function() {
          loadDoctorAppointments(currentDoctorId);
        }, [currentDoctorId]);

        // Today date calculation
        var todayKey = '';
        try {
          todayKey = (typeof window.formatDateKey === 'function') 
            ? window.formatDateKey(new Date()) 
            : new Date().toISOString().split('T')[0];
        } catch(err) {
          todayKey = new Date().toISOString().split('T')[0];
        }

        var todayAppointments = appointments.filter(function(a) {
          return a && a.date === todayKey && a.status === 'Confirmed';
        });

        var completedCount = appointments.filter(function(a) {
          return a && a.status === 'Completed';
        }).length;

        var totalRevenue = appointments
          .filter(function(a) { return a && (a.status === 'Completed' || a.status === 'Confirmed'); })
          .reduce(function(sum, a) { return sum + (Number(a.fee) || 0); }, 0);

        // Action handlers
        var handleUpdateStatus = function(aptId, newStatus) {
          try {
            if (ds && ds.updateAppointmentStatus) {
              ds.updateAppointmentStatus(aptId, newStatus);
            }
          } catch(err) {
            console.error('Update status error:', err);
          }
          loadDoctorAppointments(currentDoctorId);
        };

        var handleDoctorChange = function(newDocId) {
          setCurrentDoctorId(newDocId);
          try {
            if (ds && ds.setCurrentRole) {
              ds.setCurrentRole(newDocId);
            }
            var newUrl = window.location.pathname + '?id=' + encodeURIComponent(newDocId);
            window.history.pushState({ path: newUrl }, '', newUrl);
          } catch(err) {}
          loadDoctorAppointments(newDocId);
        };

        // RENDER DOM
        return e('div', { className: 'flex-1 flex flex-col min-h-screen' },
          
          // React Navbar
          e(window.ReactNavbar, { activePage: 'doctor-dashboard' }),

          // Main Dashboard Content
          e('main', { className: 'flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 w-full' },
            
            // Doctor Profile Banner with In-Page Doctor Switcher
            e('div', { className: 'bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-6 transition-colors' },
              e('div', { className: 'flex items-center gap-4' },
                e('img', {
                  src: activeDoctor.avatar,
                  alt: activeDoctor.name,
                  className: 'w-20 h-20 rounded-2xl object-cover border-2 border-teal-500 shadow-md'
                }),
                e('div', null,
                  e('span', { className: 'text-[11px] font-bold uppercase tracking-wider text-teal-700 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/60 px-2.5 py-0.5 rounded-full border border-teal-100 dark:border-teal-900' },
                    'Doctor Practice Portal'
                  ),
                  e('h1', { className: 'text-2xl font-black text-slate-900 dark:text-white mt-1' }, activeDoctor.name),
                  e('p', { className: 'text-xs text-slate-500 dark:text-slate-400' },
                    activeDoctor.title + ' • ' + activeDoctor.hospital
                  )
                )
              ),

              // Direct Doctor Switcher right on the page
              e('div', { className: 'flex flex-col sm:flex-row items-start sm:items-center gap-3 bg-slate-50 dark:bg-slate-800/80 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs' },
                e('div', { className: 'flex items-center gap-2 text-slate-600 dark:text-slate-300 font-semibold' },
                  e(window.DynamicIcon, { name: 'stethoscope', className: 'w-4 h-4 text-teal-600 dark:text-teal-400' }),
                  e('span', null, 'Viewing Doctor:')
                ),
                e('select', {
                  value: currentDoctorId,
                  onChange: function(evt) { handleDoctorChange(evt.target.value); },
                  className: 'bg-white dark:bg-slate-900 px-3 py-2 rounded-xl font-bold text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 outline-none cursor-pointer shadow-sm'
                },
                  allDoctors.map(function(d) {
                    return e('option', { key: d.id, value: d.id, className: 'dark:bg-slate-900 dark:text-white' },
                      d.name + ' (' + (d.specialtyName || d.specialty) + ') - Fee: ₹' + d.fee
                    );
                  })
                )
              )
            ),

            // Performance KPI Cards in INR ₹
            e('div', { className: 'grid grid-cols-2 md:grid-cols-4 gap-4' },
              
              // KPI 1: Today's Visits
              e('div', { className: 'bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors' },
                e('div', { className: 'flex items-center justify-between text-slate-400 mb-2' },
                  e('span', { className: 'text-xs font-semibold' }, "Today's Visits"),
                  e(window.DynamicIcon, { name: 'calendar', className: 'w-4 h-4 text-teal-600 dark:text-teal-400' })
                ),
                e('div', { className: 'text-2xl font-black text-slate-900 dark:text-white' }, String(todayAppointments.length)),
                e('span', { className: 'text-[11px] text-slate-500 dark:text-slate-400' }, 'Scheduled for today')
              ),

              // KPI 2: Total Consultations
              e('div', { className: 'bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors' },
                e('div', { className: 'flex items-center justify-between text-slate-400 mb-2' },
                  e('span', { className: 'text-xs font-semibold' }, 'Total Consultations'),
                  e(window.DynamicIcon, { name: 'users', className: 'w-4 h-4 text-blue-600 dark:text-blue-400' })
                ),
                e('div', { className: 'text-2xl font-black text-slate-900 dark:text-white' }, String(appointments.length)),
                e('span', { className: 'text-[11px] text-slate-500 dark:text-slate-400' }, completedCount + ' completed')
              ),

              // KPI 3: Estimated Revenue (INR ₹)
              e('div', { className: 'bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors' },
                e('div', { className: 'flex items-center justify-between text-slate-400 mb-2' },
                  e('span', { className: 'text-xs font-semibold' }, 'Estimated Revenue (INR)'),
                  e(window.DynamicIcon, { name: 'wallet', className: 'w-4 h-4 text-emerald-600 dark:text-emerald-400' })
                ),
                e('div', { className: 'text-2xl font-black text-slate-900 dark:text-white' }, '₹' + totalRevenue.toLocaleString('en-IN')),
                e('span', { className: 'text-[11px] text-slate-500 dark:text-slate-400' }, 'Fee ₹' + activeDoctor.fee + '/patient')
              ),

              // KPI 4: Patient Rating
              e('div', { className: 'bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors' },
                e('div', { className: 'flex items-center justify-between text-slate-400 mb-2' },
                  e('span', { className: 'text-xs font-semibold' }, 'Patient Rating'),
                  e(window.DynamicIcon, { name: 'star', className: 'w-4 h-4 text-amber-500' })
                ),
                e('div', { className: 'text-2xl font-black text-slate-900 dark:text-white' }, activeDoctor.rating + ' ★'),
                e('span', { className: 'text-[11px] text-slate-500 dark:text-slate-400' }, (activeDoctor.reviewsCount || 100) + ' verified reviews')
              )
            ),

            // Patient Appointment Queue Table
            e('div', { className: 'bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6 transition-colors' },
              e('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-2' },
                e('div', null,
                  e('h3', { className: 'text-lg font-black text-slate-900 dark:text-white' }, 'Patient Appointment Queue'),
                  e('p', { className: 'text-xs text-slate-500 dark:text-slate-400' }, 'Live patient appointments booked for ' + activeDoctor.name)
                ),
                e('div', { className: 'text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5' },
                  e('span', { className: 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse' }),
                  e('span', null, 'Live Queue Updates')
                )
              ),

              // If Empty Appointments
              appointments.length === 0 ? e('div', { className: 'text-center py-12 space-y-3 bg-slate-50/50 dark:bg-slate-800/30 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800' },
                e(window.DynamicIcon, { name: 'calendar-check', className: 'w-10 h-10 text-slate-300 dark:text-slate-600 mx-auto' }),
                e('h4', { className: 'font-bold text-slate-700 dark:text-slate-200 text-sm' }, 'No bookings yet for ' + activeDoctor.name),
                e('p', { className: 'text-xs text-slate-400 max-w-md mx-auto' },
                  'You can book an appointment with this doctor or pick another doctor from the dropdown above!'
                ),
                e('a', {
                  href: 'doctor-detail.html?id=' + encodeURIComponent(activeDoctor.id),
                  className: 'inline-flex items-center gap-1.5 px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all'
                },
                  e('span', null, 'Book a Slot with ' + activeDoctor.name),
                  e(window.DynamicIcon, { name: 'arrow-right', className: 'w-3.5 h-3.5' })
                )
              ) : 
              
              // Appointments Table
              e('div', { className: 'overflow-x-auto' },
                e('table', { className: 'w-full text-left text-xs' },
                  e('thead', null,
                    e('tr', { className: 'border-b border-slate-200 dark:border-slate-800 text-slate-400 uppercase tracking-wider font-semibold' },
                      e('th', { className: 'py-3 px-4' }, 'Patient'),
                      e('th', { className: 'py-3 px-4' }, 'Date & Slot'),
                      e('th', { className: 'py-3 px-4' }, 'Consultation Mode'),
                      e('th', { className: 'py-3 px-4' }, 'Symptoms / Reason'),
                      e('th', { className: 'py-3 px-4' }, 'Fee'),
                      e('th', { className: 'py-3 px-4' }, 'Status'),
                      e('th', { className: 'py-3 px-4 text-right' }, 'Actions')
                    )
                  ),
                  e('tbody', { className: 'divide-y divide-slate-100 dark:divide-slate-800' },
                    appointments.map(function(apt) {
                      var isConfirmed = apt.status === 'Confirmed';
                      var isCompleted = apt.status === 'Completed';

                      var badgeClass = isConfirmed
                        ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800'
                        : isCompleted
                        ? 'bg-blue-100 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300 border border-blue-200 dark:border-blue-800'
                        : 'bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 border border-rose-200 dark:border-rose-800';

                      return e('tr', { key: apt.id, className: 'hover:bg-slate-50/80 dark:hover:bg-slate-800/50 transition-colors' },
                        e('td', { className: 'py-4 px-4' },
                          e('div', { className: 'font-bold text-slate-900 dark:text-white' }, apt.patientName),
                          e('div', { className: 'text-[11px] text-slate-500 dark:text-slate-400' },
                            (apt.patientPhone || '') + (apt.patientAge ? (' • Age ' + apt.patientAge) : '')
                          )
                        ),
                        e('td', { className: 'py-4 px-4' },
                          e('div', { className: 'font-bold text-slate-800 dark:text-slate-200' }, apt.date),
                          e('div', { className: 'text-teal-600 dark:text-teal-400 font-semibold' }, apt.slot)
                        ),
                        e('td', { className: 'py-4 px-4' },
                          e('span', { className: 'capitalize font-medium text-slate-700 dark:text-slate-300 flex items-center gap-1' },
                            e(window.DynamicIcon, {
                              name: apt.consultationType === 'in-person' ? 'building-2' : 'video',
                              className: 'w-3.5 h-3.5 text-slate-400'
                            }),
                            e('span', null, apt.consultationType === 'in-person' ? 'Clinic Visit' : 'Video Call')
                          )
                        ),
                        e('td', { className: 'py-4 px-4 max-w-xs text-slate-600 dark:text-slate-300 truncate' },
                          apt.symptoms || 'General Medical Consultation'
                        ),
                        e('td', { className: 'py-4 px-4 font-bold text-slate-900 dark:text-white' },
                          '₹' + (Number(apt.fee) || 0)
                        ),
                        e('td', { className: 'py-4 px-4' },
                          e('span', { className: 'px-2.5 py-1 rounded-full text-[10px] font-bold ' + badgeClass },
                            apt.status
                          )
                        ),
                        e('td', { className: 'py-4 px-4 text-right space-x-1.5' },
                          isConfirmed ? e('div', { className: 'inline-flex items-center gap-1.5' },
                            e('button', {
                              onClick: function() { handleUpdateStatus(apt.id, 'Completed'); },
                              className: 'px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-[11px] shadow-sm transition-all cursor-pointer'
                            }, 'Mark Complete'),
                            e('button', {
                              onClick: function() {
                                if (confirm('Cancel this appointment?')) {
                                  handleUpdateStatus(apt.id, 'Cancelled');
                                }
                              },
                              className: 'px-2.5 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-slate-600 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 rounded-lg font-semibold text-[11px] transition-all cursor-pointer'
                            }, 'Cancel')
                          ) : e('span', { className: 'text-[11px] text-slate-400 dark:text-slate-500 italic' },
                            'No action needed'
                          )
                        )
                      );
                    })
                  )
                )
              )
            )
          ),

          // React Footer
          e(window.ReactFooter, null)
        );
      }

      // Mount React Root directly
      var rootElement = document.getElementById('root');
      if (rootElement) {
        ReactDOM.createRoot(rootElement).render(e(DoctorDashboardApp, null));
      }
    })();
  </script>
</body>
</html>
